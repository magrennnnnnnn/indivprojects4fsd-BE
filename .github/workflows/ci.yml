name: ProLink Backend CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
    build:
    name: Build Backend
    runs-on: [self-hosted, Linux, X64, docker, prolink-backend]

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Check Java and Maven
        run: |
          java -version
          ./mvnw -v

      - name: Build backend JAR
        run: ./mvnw -B clean package -Dmaven.test.skip=true

  test:
    name: Test Backend
    runs-on: [self-hosted, Linux, X64, docker, prolink-backend]
    needs: build

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests with H2
        run: ./mvnw -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:prolinktest;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

  sonarqube:
    name: SonarQube Analysis
    runs-on: [self-hosted, Linux, X64, docker, prolink-backend]
    needs: test

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and generate JaCoCo report
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:prolinktest;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

      - name: Run SonarQube analysis
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=prolink-backend \
            -Dsonar.projectName="ProLink Backend" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:prolinktest;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

  deploy:
    name: Deploy Backend Container
    runs-on: [self-hosted, Linux, X64, docker, prolink-backend]
    needs: sonarqube

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: sudo docker version

      - name: Build backend Docker image
        run: sudo docker build -t prolink-backend:latest ./ProLinkBE

      - name: Stop old backend container
        run: sudo docker stop prolink-backend || true

      - name: Remove old backend container
        run: sudo docker rm prolink-backend || true

      - name: Run backend container
        run: |
          sudo docker run -d \
            --name prolink-backend \
            -p 8080:8080 \
            -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
            -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
            -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO="update" \
            prolink-backend:latest

      - name: Wait for backend startup
        run: sleep 25

      - name: Show backend logs
        run: sudo docker logs prolink-backend --tail 100

      - name: Check backend container is running
        run: |
          STATUS=$(sudo docker inspect -f '{{.State.Running}}' prolink-backend)
          if [ "$STATUS" != "true" ]; then
            echo "Backend container is not running"
            exit 1
          fi
          echo "Backend container is running"

      - name: Health check backend
        run: curl -i http://localhost:8080/profiles/me || true