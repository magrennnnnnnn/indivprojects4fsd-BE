name: ProLink Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: [self-hosted, linux, docker]

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:prolinktest;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

  build:
    name: Build Backend JAR
    runs-on: [self-hosted, linux, docker]
    needs: test

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build backend JAR
        run: ./mvnw clean package -DskipTests

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: prolink-backend-jar
          path: ProLinkBE/target/*.jar

    sonarqube:
    name: SonarQube Analysis
    runs-on: [self-hosted, linux, docker]
    needs: build

    defaults:
      run:
        working-directory: ProLinkBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run verify and generate JaCoCo report
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:prolinktest;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect

      - name: Check JaCoCo report
        run: ls -la target/site/jacoco

      - name: Run SonarQube analysis
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=prolink-backend -Dsonar.projectName="ProLink Backend" -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-build:
    name: Build Backend Docker Image
    runs-on: [self-hosted, linux, docker]
    needs: sonarqube

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: sudo docker version

      - name: Build backend Docker image
        run: sudo docker build -t prolink-backend:latest ./ProLinkBE

      - name: Show Docker images
        run: sudo docker images
  
  